<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TORNADO — оборудование для профессиональной химчистки</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <p class="wordmark">TORNADO</p>
      <nav aria-label="Разделы">
        <button type="button" data-note="Раздел «Оборудование» в этой концепции не подключён.">Оборудование</button>
        <button type="button" data-note="Раздел «Применение» в этой концепции не подключён.">Применение</button>
      </nav>
      <div class="header-actions">
        <button type="button" class="btn-catalog" data-note="Каталог в этой концепции не подключён. Это макет первого экрана.">Каталог</button>
        <button type="button" class="btn-quiet" data-note="Это отдельная концепция главной страницы, не интернет-магазин.">Концепция главной страницы</button>
      </div>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <div class="panel panel-photo">
        <img src="assets/cyclone-z020.png" width="600" height="600" alt="Пневматический аппарат Cyclone: белая ёмкость, металлический пистолет и чёрная воронка.">
      </div>
      <div class="panel panel-copy">
        <ul class="pills">
          <li>Пневмооборудование</li>
          <li>Химчистка</li>
          <li>Уход за салоном</li>
        </ul>
        <div class="copy-bottom">
          <h1 id="hero-title"><span>Профессиональная химчистка:</span> оборудование для чистого результата</h1>
          <p class="lead">Пневматические аппараты Cyclone с бачком и воронкой. Состав подаётся вместе с потоком воздуха и снимает загрязнения с текстиля, кожи и пластика.</p>
          <button type="button" class="cta" data-note="Каталог в этой концепции не подключён. Это макет первого экрана.">Смотреть каталог</button>
          <p id="note" class="note" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>
  </div>
  <script src="assets/main.js"></script>
</body>
</html>
